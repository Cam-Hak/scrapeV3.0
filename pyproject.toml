[project]
name = "scrapev3"
version = "0.1.0"
description = "Layout-agnostic news and press-release scraper for 5k-50k sites"
requires-python = ">=3.11"

# Every dependency here is open-source and self-hosted. No paid services.
dependencies = [
    # --- fetch ---------------------------------------------------------
    "curl_cffi>=0.7",       # correct TLS/JA4 + HTTP/2 fingerprint
    "protego>=0.3",         # robots.txt incl. Crawl-delay and wildcards
    "tldextract>=5.1",      # eTLD+1 via public suffix list
    "w3lib>=2.2",           # charset detection + URL canonicalization

    # --- parse / extract -----------------------------------------------
    "selectolax>=0.3.21",   # lexbor DOM, ~30x BeautifulSoup
    "trafilatura>=2.0",     # body of record
    "htmldate>=1.9",        # date of record
    "python-dateutil>=2.9",
    "dateparser>=1.2",      # relative dates, 200+ locales

    # --- cli / output ---------------------------------------------------
    "rich>=13.7",
]

[project.optional-dependencies]
# Installed as later phases land, so the base install stays small.
postprocess = [
    "ftfy>=6.2",
    "fast-langdetect>=0.2",
    "pyahocorasick>=2.1",
    "datasketch>=1.6",
    "resiliparse>=0.14",    # second-opinion extractor / quality signal
]
# The tns.press_release sink. Unidecode is not optional polish: that table
# is latin1, so a curly quote from a web page is unstorable without it.
sink = ["PyMySQL>=1.1", "Unidecode>=1.3"]
browser = ["nodriver>=0.38"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
scrapev3 = "scrapev3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The status page is data, not code, and `clients/status_demo.php` renders the
# same file - so it has to survive being installed, not just run from the tree.
[tool.setuptools.package-data]
scrapev3 = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
